<svg xmlns="http://www.w3.org/2000/svg" width="820" height="460" viewBox="0 0 820 460" role="img" aria-labelledby="title desc">
<title id="title">Trust among current AI users</title>
<desc id="desc">Positive and negative trust among current AI users who answered the trust question. Annual samples differ; these are not the same people over time.</desc>
<rect width="820" height="460" fill="white"/>
<g font-family="sans-serif" fill="#17252f">
<text x="65" y="30" font-size="20">Trust among current AI users</text>
<line x1="80" y1="340.0" x2="720" y2="340.0" stroke="#d8dee3"/>
<text x="35" y="345.0" font-size="13">0%</text>
<line x1="80" y1="288.0" x2="720" y2="288.0" stroke="#d8dee3"/>
<text x="35" y="293.0" font-size="13">20%</text>
<line x1="80" y1="236.0" x2="720" y2="236.0" stroke="#d8dee3"/>
<text x="35" y="241.0" font-size="13">40%</text>
<line x1="80" y1="184.0" x2="720" y2="184.0" stroke="#d8dee3"/>
<text x="35" y="189.0" font-size="13">60%</text>
<line x1="80" y1="132.0" x2="720" y2="132.0" stroke="#d8dee3"/>
<text x="35" y="137.0" font-size="13">80%</text>
<line x1="80" y1="80.0" x2="720" y2="80.0" stroke="#d8dee3"/>
<text x="35" y="85.0" font-size="13">100%</text>
<text x="82" y="365" font-size="15">2023</text>
<text x="372" y="365" font-size="15">2024</text>
<text x="662" y="365" font-size="15">2025</text>
<polyline points="100,277.139 390,261.049 680,243.139" fill="none" stroke="#1769aa" stroke-width="3"/>
<circle cx="100" cy="277.139" r="5" fill="#1769aa"/>
<text x="109" y="265.139" fill="#1769aa" font-size="14">24.2%</text>
<circle cx="390" cy="261.049" r="5" fill="#1769aa"/>
<text x="399" y="249.049" fill="#1769aa" font-size="14">30.4%</text>
<circle cx="680" cy="243.139" r="5" fill="#1769aa"/>
<text x="689" y="231.139" fill="#1769aa" font-size="14">37.3%</text>
<polyline points="100,214.747 390,228.094 680,237.696" fill="none" stroke="#b64b25" stroke-width="3"/>
<circle cx="100" cy="214.747" r="5" fill="#b64b25"/>
<text x="109" y="234.747" fill="#b64b25" font-size="14">48.2%</text>
<circle cx="390" cy="228.094" r="5" fill="#b64b25"/>
<text x="399" y="248.094" fill="#b64b25" font-size="14">43.0%</text>
<circle cx="680" cy="237.696" r="5" fill="#b64b25"/>
<text x="689" y="257.696" fill="#b64b25" font-size="14">39.3%</text>
<text x="90" y="397" fill="#1769aa" font-size="14">Negative trust (users)</text>
<text x="310" y="397" fill="#b64b25" font-size="14">Positive trust (users)</text>
